name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:                      # nombre del check: "build"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - run: dotnet build Orders.sln --configuration Release

  test:                       # nombre del check: "test"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - run: dotnet test Orders.sln --configuration Release
